<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">brand-assets</title>
  <desc id="d">The logo, the photos, and who may use them. The picture: a 6-sided figure draws itself and its corners arrive one by one. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2918"/><stop offset="1" stop-color="#101919"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#4d7c0f"/><stop offset="0.50" stop-color="#65a30d"/><stop offset="1.00" stop-color="#afd476"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#65a30d" stop-opacity="0"/><stop offset=".35" stop-color="#65a30d"/><stop offset="1" stop-color="#afd476"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <path d="M977.1 177.0 L924.8 163.5 L910.4 111.5 L948.2 73.0 L1000.5 86.5 L1015.0 138.5Z" fill="#2a4116" fill-opacity=".35" stroke="#3c6013" stroke-width="1.5"/>
    <path d="M962.7 125.0L1026.9 188.1" stroke="#2a4116" stroke-width="1"/>
    <path d="M962.7 125.0L940.2 212.1" stroke="#2a4116" stroke-width="1"/>
    <path d="M962.7 125.0L875.9 149.1" stroke="#2a4116" stroke-width="1"/>
    <path d="M962.7 125.0L898.5 61.9" stroke="#2a4116" stroke-width="1"/>
    <path d="M962.7 125.0L985.2 37.9" stroke="#2a4116" stroke-width="1"/>
    <path d="M962.7 125.0L1049.4 100.9" stroke="#2a4116" stroke-width="1"/>
    <path class="draw" pathLength="100" d="M1026.9 188.1 L940.2 212.1 L875.9 149.1 L898.5 61.9 L985.2 37.9 L1049.4 100.9Z" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.30s"/>
    <circle class="arrive" style="animation-delay:0.35s" cx="1026.9" cy="188.1" r="7" fill="#101919" stroke="#afd476" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:0.83s" cx="940.2" cy="212.1" r="7" fill="#101919" stroke="#afd476" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:1.32s" cx="875.9" cy="149.1" r="7" fill="#101919" stroke="#afd476" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:1.80s" cx="898.5" cy="61.9" r="7" fill="#101919" stroke="#afd476" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:2.28s" cx="985.2" cy="37.9" r="7" fill="#101919" stroke="#afd476" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:2.77s" cx="1049.4" cy="100.9" r="7" fill="#101919" stroke="#afd476" stroke-width="2.5"/>
    <circle class="halo" cx="962.7" cy="125.0" r="12" fill="none" stroke="#afd476" stroke-width="2"/>
    <circle class="breathe" cx="962.7" cy="125.0" r="10" fill="#65a30d"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#365314"/><rect x="300.0" y="248" width="300.5" height="12" fill="#4d7c0f"/><rect x="600.0" y="248" width="300.5" height="12" fill="#65a30d"/><rect x="900.0" y="248" width="300.5" height="12" fill="#ecfccb"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="72.0" fill="#65a30d" font-size="15" font-weight="700" letter-spacing=".6">Wilson's Lawn Maintenance</text><text x="56" y="137.6" fill="#ecfccb" font-size="60" font-weight="700" letter-spacing="-.5">brand-assets</text><text x="56" y="181.4" fill="#cfdeb2" font-size="23">The logo, the photos, and who may use them.</text></g>
  </g>
</svg>
